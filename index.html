<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinity — Private Workspace</title>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- STARTUP / AUTH SCREEN -->
    <div class="startup" id="startup">
        <div class="startup-card">
            
            <div class="startup-logo">
                <img src="infinity.png" alt="Infinity" onerror="this.style.display='none'">
                <div class="logo-fallback">∞</div>
            </div>

            <h1 class="startup-title">infinity</h1>
            <p class="startup-sub">End-to-End Encrypted Workspace</p>

            <div class="input-group">
                <label for="key">Authentication Key</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="key" 
                        placeholder="Enter authorization key…" 
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button class="toggle-password" type="button" aria-label="Toggle Key Visibility" onclick="togglePasswordVisibility()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <span class="input-error" id="keyError">Invalid authentication key. Please verify and try again.</span>
            </div>

            <button class="btn-primary" onclick="start()">
                <span>Access Terminal</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>

            <a href="infinity.apk" download class="btn-download">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download Native Android APK
            </a>

        </div>
    </div>

    <!-- GLOBAL LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-container">
            <div class="spinner"></div>
            <span class="loading-text">Establishing Connection...</span>
        </div>
    </div>

    <!-- MAIN CHAT APPLICATION -->
    <div class="app" id="app" style="display:none;">

        <!-- HEADER BAR -->
        <header class="app-header">
            <div class="header-left">
                <div class="header-avatar">
                    <span id="otherInitial">?</span>
                    <span class="online-dot"></span>
                </div>
                <div class="header-info">
                    <h3 id="otherName">Loading participant…</h3>
                    <div class="status-indicator">
                        <span class="status-pulse"></span>
                        <span class="header-status">Encrypted & Online</span>
                    </div>
                </div>
            </div>

            <div class="header-actions">
                <button class="icon-btn" title="Clear Chat History" aria-label="Clear chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- CHAT STREAM AREA -->
        <main class="chat-area" id="chatArea">
            <div class="messages" id="messages"></div>
        </main>

        <!-- LIGHTBOX PREVIEW -->
        <div class="lightbox" id="lightbox" onclick="closeLightbox()">
            <div class="lightbox-content">
                <img id="lightboxImg" src="" alt="Full-size view">
                <button class="lightbox-close">✕</button>
            </div>
        </div>

        <!-- BOTTOM INPUT BAR -->
        <footer class="input-bar">

            <!-- PREVIEW CONTAINER FOR SELECTED MEDIA -->
            <div class="image-preview" id="imagePreview">
                <div class="preview-wrapper">
                    <img id="previewImg" src="" alt="Selected Attachment">
                    <button class="remove-preview" onclick="clearImagePreview()" aria-label="Remove image">✕</button>
                </div>
            </div>

            <div class="controls-group">
                <!-- IMAGE FILE INPUT -->
                <label class="attach-btn" for="imageInput" title="Attach Image">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="4"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </label>
                <input 
                    type="file" 
                    id="imageInput" 
                    accept="image/*" 
                    style="display:none;" 
                    onchange="handleImageSelect(event)"
                >

                <!-- VIDEO FILE INPUT -->
                <label class="attach-btn" for="videoInput" title="Attach Video">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="3"/>
                    </svg>
                </label>
                <input 
                    type="file" 
                    id="videoInput" 
                    accept="video/*" 
                    style="display:none;" 
                    onchange="handleVideoSelect(event)"
                >

                <!-- AUDIO RECORDING BUTTON -->
                <button class="attach-btn record-btn" id="recordBtn" onclick="toggleRecording()" title="Record Audio">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
            </div>

            <!-- TEXT FIELD -->
            <div class="text-input-wrapper">
                <input 
                    type="text" 
                    id="message" 
                    placeholder="Type a message…" 
                    autocomplete="off"
                    enterkeyhint="send"
                >
            </div>

            <!-- SEND BUTTON -->
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send Message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>

        </footer>

    </div>

    <script src="script.js"></script>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('key');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
