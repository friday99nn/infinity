<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Infinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="startup" id="startup">
        <div class="startup-card">
            <div class="startup-logo">
                <img src="infinity.png" alt="Infinity" onerror="this.style.display='none'">
                <div class="logo-fallback">∞</div>
            </div>
            <h1 class="startup-title">infinity</h1>
            <p class="startup-sub">your private space to connect</p>
            <div class="input-group">
                <label>Authentication Key</label>
                <input type="password" id="key" placeholder="Enter your key…" autocomplete="off">
                <span class="input-error" id="keyError" style="display: none; color: #ef4444; font-size: 0.8rem; margin-top: 5px;">Invalid key. Try again.</span>
            </div>
            <button class="btn-primary" onclick="start()">
                <span>Enter</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <a href="infinity.apk" download class="btn-download" style="margin-top: 15px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download Android App
            </a>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="app" id="app" style="display:none;">
        <header class="app-header">
            <div class="header-avatar">
                <span id="otherInitial">?</span>
                <span class="online-dot"></span>
            </div>
            <div class="header-info">
                <h3 id="otherName">Loading…</h3>
                <span class="header-status">online</span>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="messages" id="messages"></div>
        </div>

        <div class="lightbox" id="lightbox" onclick="closeLightbox()">
            <img id="lightboxImg" src="" alt="">
        </div>

        <div class="input-bar">
            <!-- Floating Preview -->
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="">
                <button class="remove-preview" onclick="clearImagePreview()">✕</button>
            </div>

            <label class="attach-btn" for="imageInput">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </label>
            <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">

            <input type="text" id="message" placeholder="Message…" autocomplete="off">

            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>

    <div style="width:100%; height:100%; position:fixed; top:0; left:0; display:flex; align-items:center; justyfy-contents:center; flex-direction:column; background-color:white;">
        <h3>FiAmanAllah</h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
